; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; =================================================================
; M5Stack AtomS3 RC Telemetry Master
; =================================================================

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino

; Serial Monitor Speed
monitor_speed = 115200

; Flash settings
board_build.filesystem = littlefs
; "no_ota.csv" gives ~2MB APP and ~2MB FS (LittleFS), crucial for logging
board_build.partitions = no_ota.csv

; Build Flags
; -DCORE_DEBUG_LEVEL=5 ; Uncomment for verbose debugging
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Library Dependencies
; Versions matched to your successful Arduino IDE log
lib_deps =
    m5stack/M5Unified @ ^0.1.16
    m5stack/M5GFX @ ^0.1.16
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^7.0.0
    
    ; AsyncWebServer and TCP (Using active forks compatible with ESP32-S3)
    mathieucarbou/AsyncTCP @ ^3.2.4
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5